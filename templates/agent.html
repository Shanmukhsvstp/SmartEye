<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEye Agent</title>

    <style>
        :root {
            --color-accent-light: #e6f1ff;
            --color-accent-dark: #011038;

            --feature-accent: #2c90f3;
            --feature-accent-dark: #9cccfc;

            --background-tile-accent: #9cccfc;
            --background-tile-accent-dark: #2c90f3;

            --color-text: #000000;
            --color-text-dark: #ffffff;
        }

        body {
            background-color: var(--color-accent-light);
            font-family: Inter, sans-serif;
            margin: 0;
            padding: 0;
        }

        @media (prefers-color-scheme: dark) {

            body {
                background-color: var(--color-accent-dark);
                color: white;
            }

            .upload {
                background-color: var(--background-tile-accent-dark);
            }

            button {
                background-color: var(--feature-accent-dark);
                color: var(--color-text-dark);
            }

            .progress-container {
                background-color: #1b2a4f;
            }
        }

        .content {
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            margin-top: 5vh;
        }

        .upload {
            margin-top: 5vh;

            background-color: var(--background-tile-accent);

            border-radius: 30px;

            padding: 140px;

            cursor: pointer;

            transition: 0.2s;
        }

        .upload.dragging {
            transform: scale(1.02);
        }

        .upload-label {
            display: block;
            width: 100%;
            height: 100%;
            text-align: center;
            cursor: pointer;
            font-size: 20px;
        }

        .file-name {
            margin-top: 15px;
            font-size: 14px;
        }

        button {
            margin-top: 30px;

            background-color: var(--feature-accent);

            border: none;

            padding: 12px 20px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 15px;
        }

        .progress-wrapper {
            margin-top: 30px;
            width: 60%;
            max-width: 600px;
        }

        .progress-container {
            width: 100%;
            height: 25px;
            border-radius: 999px;
            overflow: hidden;
            background-color: #d5e6ff;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--feature-accent);
            transition: width 0.3s ease;
        }

        .progress-text {
            margin-top: 10px;
            text-align: center;
        }

        .results {
            margin-top: 40px;
            margin-bottom: 50px;
        }

        table,
        td,
        th {
            border: 1px solid;
            border-collapse: collapse;
            padding: 8px;
        }

        table {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <div class="content">

        <div class="title">
            <h1>Scan PDFs with SmartEye</h1>
        </div>

        <div class="upload">

            <input
                id="pdf"
                type="file"
                accept=".pdf,application/pdf"
                hidden
            />

            <label for="pdf" class="upload-label">
                Click or Drop PDF Here
            </label>

        </div>

        <div class="file-name" id="fileName">
            No PDF Selected
        </div>

        <button onclick="scanPDF()">
            Submit
        </button>

        <div class="progress-wrapper">

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="progress-text" id="progressText">
                Waiting...
            </div>

        </div>

        <div class="results">
            <div id="res"></div>
        </div>

    </div>

    <script>

        const scanner_url = "/api/scan/agent/upload";
        const ws_endpoint = "/api/scan/agent";

        const upload = document.querySelector(".upload");
        const input = document.querySelector("#pdf");

        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");

        input.addEventListener("change", () => {

            const file = input.files[0];

            if (!file) return;

            document.getElementById("fileName").textContent =
                `Selected: ${file.name}`;
        });

        upload.addEventListener("dragover", (e) => {
            e.preventDefault();
            upload.classList.add("dragging");
        });

        upload.addEventListener("dragleave", () => {
            upload.classList.remove("dragging");
        });

        upload.addEventListener("drop", (e) => {

            e.preventDefault();

            upload.classList.remove("dragging");

            const files = e.dataTransfer.files;

            const dt = new DataTransfer();

            for (const file of files) {

                if (file.type === "application/pdf") {
                    dt.items.add(file);
                }
            }

            input.files = dt.files;

            if (input.files[0]) {

                document.getElementById("fileName").textContent =
                    `Selected: ${input.files[0].name}`;
            }
        });

        function renderCSV(csv) {

            const rows = csv.trim().split("\n");

            const table = document.createElement("table");

            for (const row of rows) {

                const tr = document.createElement("tr");

                const cols = row.split(",");

                for (const col of cols) {

                    const td = document.createElement("td");

                    td.textContent = col;

                    tr.appendChild(td);
                }

                table.appendChild(tr);
            }

            document.getElementById("res").appendChild(table);
        }

        async function scanPDF() {

            const pdf = input.files[0];

            if (!pdf) {
                alert("Please select a PDF");
                return;
            }

            progressText.textContent = "Uploading PDF...";

            const fD = new FormData();

            fD.append("pdf", pdf);

            const res = await fetch(scanner_url, {
                method: "POST",
                body: fD
            });

            const data = await res.json();

            handleWs(data.worker_id);
        }

        function handleWs(worker_id) {

            const ws = new WebSocket(
                `${ws_endpoint}/${worker_id}`
            );

            ws.onmessage = (e) => {

                const data = JSON.parse(e.data);

                console.log(data);

                if (data.type === "progress") {

                    progressBar.style.width =
                        `${data.progress}%`;

                    progressText.textContent =
                        `${data.message} (${data.progress}%)`;
                }

                if (data.type === "task_complete") {

                    progressBar.style.width = "100%";

                    progressText.textContent =
                        "Completed Analysis";

                    const data_arr = data.data;

                    for (const [csv, usn] of data_arr) {

                        const heading =
                            document.createElement("h2");

                        heading.textContent = usn;

                        document
                            .getElementById("res")
                            .appendChild(heading);

                        renderCSV(csv);
                    }
                }
            };

            ws.onclose = () => {
                console.log("Disconnected");
            };
        }

    </script>

</body>

</html>
